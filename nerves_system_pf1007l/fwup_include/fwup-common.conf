#
# Firmware configuration file for the Allwinner A33 PF1007L Photo Frame
#

# Allwinner BROM loads SPL from sector 16 (8 KiB offset)
define(UBOOT_OFFSET, 16)
define(UBOOT_COUNT, 2032) # ~1 MiB

# U-Boot environment at 0x400000 (4 MiB = sector 8192), size 16 KiB (32 blocks)
define(UBOOT_ENV_OFFSET, 8192)
define(UBOOT_ENV_COUNT, 32)

# Boot FAT partition (mmcblk0p1, ~38 MiB at sector 8256 -> FAT16/FAT32 in fwup)
define(BOOT_PART_OFFSET, 8256)
define(BOOT_PART_COUNT, 77248)

# Rootfs A & B (SquashFS, ~150 MiB each)
define(ROOTFS_A_PART_OFFSET, 86016)
define(ROOTFS_A_PART_COUNT, 307200)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Application partition (F2FS, expands to fill card)
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 1048576)

# Let the rootfs have room to grow up to the maximum size
define(NERVES_FW_PLATFORM, "pf1007l")
define(NERVES_FW_ARCHITECTURE, "arm")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/mmcblk0p4")
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
